<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-labelledby="m-act-t m-act-d">
<title id="m-act-t">Contribution Activity Graph</title>
<desc id="m-act-d">31-Day activity polyline graph showing daily commit volume.</desc>

<style>
.serif { font-family: 'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif; }
.sans { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; }
.mono { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; }
.kick { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; font-size: 11px; letter-spacing: 3px; fill: #839DFB; }
.twinkle { animation: tw 4s ease-in-out infinite; }
@keyframes tw { 0%, 100% { opacity: .15; } 50% { opacity: .9; } }
.pulse { animation: pl 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes pl { 0%, 100% { opacity: .55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.35); } }
.float { animation: fl 6s ease-in-out infinite; }
@keyframes fl { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.spin { animation: sp 60s linear infinite; transform-box: fill-box; transform-origin: center; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  .twinkle, .pulse, .float, .spin { animation: none !important; }
}
</style>

<defs>
  <radialGradient id="m-act-bg" cx="70%" cy="30%" r="90%">
    <stop offset="0" stop-color="#161C30"/>
    <stop offset=".55" stop-color="#10131F"/>
    <stop offset="1" stop-color="#090B12"/>
  </radialGradient>
  <radialGradient id="m-act-glowA" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#416AE6" stop-opacity=".45"/>
    <stop offset="1" stop-color="#416AE6" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="m-act-glowB" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#E6E9F0" stop-opacity=".12"/>
    <stop offset="1" stop-color="#E6E9F0" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="m-act-silver" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset=".5" stop-color="#C5CAD8"/>
    <stop offset="1" stop-color="#839DFB"/>
  </linearGradient>
  <linearGradient id="m-act-amber" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FFE7B3"/>
    <stop offset=".5" stop-color="#FFB23F"/>
    <stop offset="1" stop-color="#F0A8D0"/>
  </linearGradient>
  <linearGradient id="m-act-rule" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#839DFB" stop-opacity="0"/>
    <stop offset=".25" stop-color="#839DFB" stop-opacity=".8"/>
    <stop offset="1" stop-color="#839DFB" stop-opacity="0"/>
  </linearGradient>
  <pattern id="m-act-grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M28 0H0V28" fill="none" stroke="#839DFB" stroke-opacity=".05"/>
  </pattern>
</defs>

<rect x="1" y="1" width="1198" height="278" rx="22" fill="url(#m-act-bg)" stroke="#262E47"/>
<rect x="1" y="1" width="1198" height="278" rx="22" fill="url(#m-act-grid)"/>
<ellipse cx="600" cy="112" rx="420" ry="196" fill="url(#m-act-glowA)"/>
<ellipse cx="600" cy="168" rx="300" ry="140" fill="url(#m-act-glowB)"/><text x="40" y="46" class="mono" font-size="11" fill="#FFB23F" text-anchor="start" letter-spacing="3">31-DAY COMMIT ACTIVITY GRAPH</text><text x="1160" y="46" class="mono" font-size="11" fill="#8FE3C8" text-anchor="end" letter-spacing="2">170 COMMITS ACROSS 31 DAYS</text><path d="M60 230.0H1160" stroke="#262E47" stroke-dasharray="3 4"/><text x="48" y="234.0" class="mono" font-size="10.5" fill="#646E89" text-anchor="end" >0</text><path d="M60 192.5H1160" stroke="#262E47" stroke-dasharray="3 4"/><text x="48" y="196.5" class="mono" font-size="10.5" fill="#646E89" text-anchor="end" >4</text><path d="M60 155.0H1160" stroke="#262E47" stroke-dasharray="3 4"/><text x="48" y="159.0" class="mono" font-size="10.5" fill="#646E89" text-anchor="end" >8</text><path d="M60 117.5H1160" stroke="#262E47" stroke-dasharray="3 4"/><text x="48" y="121.5" class="mono" font-size="10.5" fill="#646E89" text-anchor="end" >12</text><path d="M60 80.0H1160" stroke="#262E47" stroke-dasharray="3 4"/><text x="48" y="84.0" class="mono" font-size="10.5" fill="#646E89" text-anchor="end" >16</text>
<defs>
  <linearGradient id="m-act-fill" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#416AE6" stop-opacity=".45"/>
    <stop offset="1" stop-color="#416AE6" stop-opacity="0"/>
  </linearGradient>
