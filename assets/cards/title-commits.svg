<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 104" width="1200" height="104" role="img" aria-labelledby="tcommits-t tcommits-d">
<title id="tcommits-t">07 COMMIT LOG: Telemetry &amp; shipping.</title>
<desc id="tcommits-d">CONTRIBUTIONS</desc>

<style>
.serif { font-family: 'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif; }
.sans { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; }
.mono { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; }
.kick { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; font-size: 11px; letter-spacing: 3px; fill: #839DFB; }
.twinkle { animation: tw 4s ease-in-out infinite; }
@keyframes tw { 0%, 100% { opacity: .15; } 50% { opacity: .9; } }
.pulse { animation: pl 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes pl { 0%, 100% { opacity: .55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.35); } }
.float { animation: fl 6s ease-in-out infinite; }
@keyframes fl { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.spin { animation: sp 60s linear infinite; transform-box: fill-box; transform-origin: center; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  .twinkle, .pulse, .float, .spin { animation: none !important; }
}
</style>

<defs>
  <radialGradient id="tcommits-bg" cx="70%" cy="30%" r="90%">
    <stop offset="0" stop-color="#161C30"/>
    <stop offset=".55" stop-color="#10131F"/>
    <stop offset="1" stop-color="#090B12"/>
  </radialGradient>
  <radialGradient id="tcommits-glowA" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#416AE6" stop-opacity=".45"/>
    <stop offset="1" stop-color="#416AE6" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="tcommits-glowB" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#E6E9F0" stop-opacity=".12"/>
    <stop offset="1" stop-color="#E6E9F0" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="tcommits-silver" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset=".5" stop-color="#C5CAD8"/>
    <stop offset="1" stop-color="#839DFB"/>
  </linearGradient>
  <linearGradient id="tcommits-amber" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FFE7B3"/>
    <stop offset=".5" stop-color="#FFB23F"/>
    <stop offset="1" stop-color="#F0A8D0"/>
  </linearGradient>
  <linearGradient id="tcommits-rule" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#839DFB" stop-opacity="0"/>
    <stop offset=".25" stop-color="#839DFB" stop-opacity=".8"/>
    <stop offset="1" stop-color="#839DFB" stop-opacity="0"/>
  </linearGradient>
  <pattern id="tcommits-grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M28 0H0V28" fill="none" stroke="#839DFB" stroke-opacity=".05"/>
  </pattern>
</defs>

<text x="30" y="32" class="mono" font-size="12" fill="#E6E9F0" text-anchor="start" letter-spacing="3">07</text>
<text x="58" y="32" class="mono" font-size="12" fill="#839DFB" text-anchor="start" letter-spacing="3">COMMIT LOG</text>
<text x="1170" y="32" class="mono" font-size="11" fill="#939BB4" text-anchor="end" letter-spacing="3">CONTRIBUTIONS</text>
<text x="30" y="80" class="serif" font-size="40" fill="#E6E9F0">Telemetry &amp; <tspan fill="#839DFB" font-style="italic">shipping.</tspan></text>
<rect x="30" y="96" width="1140" height="1.2" fill="url(#tcommits-rule)"/>
<circle cy="96.6" r="2.6" fill="#fff">
  <animate attributeName="cx" values="30;1170" dur="6s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.8;1" dur="6s" repeatCount="indefinite"/>
</circle>

</svg>
