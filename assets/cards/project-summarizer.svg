<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 318" width="1200" height="318" role="img" aria-labelledby="p-summarizer-t p-summarizer-d">
<title id="p-summarizer-t">Meeting Summarizer</title>
<desc id="p-summarizer-d">Meeting Summarizer: Real-time speech transcription and executive minutes extraction powered by Groq LPUs. Groq LPU whisper-large-v3 · adaptive FFmpeg chunking · silence gating · LLaMA 3 structured minutes.</desc>

<style>
.serif { font-family: 'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif; }
.sans { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; }
.mono { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; }
.kick { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; font-size: 11px; letter-spacing: 3px; fill: #839DFB; }
.twinkle { animation: tw 4s ease-in-out infinite; }
@keyframes tw { 0%, 100% { opacity: .15; } 50% { opacity: .9; } }
.pulse { animation: pl 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes pl { 0%, 100% { opacity: .55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.35); } }
.float { animation: fl 6s ease-in-out infinite; }
@keyframes fl { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.spin { animation: sp 60s linear infinite; transform-box: fill-box; transform-origin: center; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  .twinkle, .pulse, .float, .spin { animation: none !important; }
}
</style>

