chor="start" >React 18 · Vite</text><text x="508" y="387" class="serif" font-size="17" fill="#C5CAD8" text-anchor="start" >Tailwind CSS</text><text x="508" y="418" class="serif" font-size="15" fill="#939BB4" text-anchor="start" >HTML5 Canvas API</text><text x="508" y="447" class="serif" font-size="14" fill="#939BB4" text-anchor="start" >Responsive Layouts</text><rect x="508" y="500" width="40" height="2" rx="1" fill="#839DFB"><animate attributeName="width" values="40;181;40" dur="12s" repeatCount="indefinite"/></rect><rect x="719" y="280" width="217" height="232" rx="16" fill="#12182A" stroke="#2B3963"/><text x="737" y="312" class="mono" font-size="11" fill="#839DFB" text-anchor="start" letter-spacing="1.5">09 TOOLS &amp; DEV</text><text x="737" y="352" class="serif" font-size="21" fill="#E6E9F0" text-anchor="start" >VS Code · Linux</text><text x="737" y="387" class="serif" font-size="17" fill="#C5CAD8" text-anchor="start" >Postman · PowerShell</text><text x="737" y="418" class="serif" font-size="15" fill="#939BB4" text-anchor="start" >Figma · Git CLI</text><text x="737" y="447" class="serif" font-size="14" fill="#939BB4" text-anchor="start" >GitHub Actions</text><rect x="737" y="500" width="40" height="2" rx="1" fill="#839DFB"><animate attributeName="width" values="40;181;40" dur="13s" repeatCount="indefinite"/></rect><rect x="948" y="280" width="217" height="232" rx="16" fill="#12182A" stroke="#2B3963"/><text x="966" y="312" class="mono" font-size="11" fill="#839DFB" text-anchor="start" letter-spacing="1.5">10 CLIMATE &amp; DMRV</text><text x="966" y="352" class="serif" font-size="21" fill="#E6E9F0" text-anchor="start" >Puro.earth / EBC</text><text x="966" y="387" class="serif" font-size="17" fill="#C5CAD8" text-anchor="start" >Stoichiometric Formulas</text><text x="966" y="418" class="serif" font-size="15" fill="#939BB4" text-anchor="start" >Carbon Sequestration</text><text x="966" y="447" class="serif" font-size="14" fill="#939BB4" text-anchor="start" >Dynamic QR Vouchers</text><rect x="966" y="500" width="40" height="2" rx="1" fill="#839DFB"><animate attributeName="width" values="40;181;40" dur="14s" repeatCount="indefinite"/></rect>
