tart" >SHA-256 Hash Ledgers</text><text x="508" y="170" class="serif" font-size="15" fill="#939BB4" text-anchor="start" >TOTP MFA · 6-Role RBAC</text><text x="508" y="199" class="serif" font-size="14" fill="#939BB4" text-anchor="start" >Zero-Trust Architecture</text><rect x="508" y="252" width="40" height="2" rx="1" fill="#839DFB"><animate attributeName="width" values="40;181;40" dur="7s" repeatCount="indefinite"/></rect><rect x="719" y="32" width="217" height="232" rx="16" fill="#12182A" stroke="#2B3963"/><text x="737" y="64" class="mono" font-size="11" fill="#839DFB" text-anchor="start" letter-spacing="1.5">04 BACKEND &amp; APIS</text><text x="737" y="104" class="serif" font-size="21" fill="#E6E9F0" text-anchor="start" >FastAPI · Node.js</text><text x="737" y="139" class="serif" font-size="17" fill="#C5CAD8" text-anchor="start" >Express · REST APIs</text><text x="737" y="170" class="serif" font-size="15" fill="#939BB4" text-anchor="start" >WebSockets · AsyncIO</text><text x="737" y="199" class="serif" font-size="14" fill="#939BB4" text-anchor="start" >SQLAlchemy ORM</text><rect x="737" y="252" width="40" height="2" rx="1" fill="#839DFB"><animate attributeName="width" values="40;181;40" dur="8s" repeatCount="indefinite"/></rect><rect x="948" y="32" width="217" height="232" rx="16" fill="#12182A" stroke="#2B3963"/><text x="966" y="64" class="mono" font-size="11" fill="#839DFB" text-anchor="start" letter-spacing="1.5">05 CLOUD &amp; INFRA</text><text x="966" y="104" class="serif" font-size="21" fill="#E6E9F0" text-anchor="start" >Oracle Cloud (OCI)</text><text x="966" y="139" class="serif" font-size="17" fill="#C5CAD8" text-anchor="start" >AWS EC2 · Groq LPUs</text><text x="966" y="170" class="serif" font-size="15" fill="#939BB4" text-anchor="start" >Docker Containers</text><text x="966" y="199" class="serif" font-size="14" fill="#939BB4" text-anchor="start" >Vercel · Git CLI</text><rect x="966" y="252" width="40" height="2" rx="1" fill="#839DFB"><animate attributeNa