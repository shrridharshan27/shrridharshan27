<ellipse cx="960" cy="127" rx="420" ry="223" fill="url(#p-cps-glowA)"/>
<ellipse cx="240" cy="191" rx="300" ry="159" fill="url(#p-cps-glowB)"/>
<text x="40" y="44" class="mono" font-size="11" fill="#839DFB" text-anchor="start" letter-spacing="3">04 · CYBER PHYSICAL SYSTEMS · EMBEDDED TELEMETRY</text>
<text x="38" y="96" class="serif" font-size="44" fill="url(#p-cps-silver)" text-anchor="start" >Cyber Physical Systems</text>
<text x="40" y="128" class="serif" font-size="17" fill="#C5CAD8" text-anchor="start" font-style="italic">Hardware sensor telemetry acquisition and real-time edge fault boundary defense.</text>
<text x="40" y="154" class="mono" font-size="12" fill="#939BB4" text-anchor="start" >BUILT › Deterministic I2C/SPI sampling · Kalman noise filtering · dual-watchdog reset ·</text><text x="40" y="172" class="mono" font-size="12" fill="#939BB4" text-anchor="start" >         sensor spoofing defense</text>
<rect x="40" y="186" width="680" height="1" fill="#2B3963"/>
<text x="40" y="222" class="serif" font-size="30" fill="#E6E9F0" text-anchor="start" >&lt; 50ms</text><text x="40" y="245" class="sans" font-size="13" fill="#939BB4" text-anchor="start" >edge fault detection latency</text><text x="265" y="222" class="serif" font-size="30" fill="#E6E9F0" text-anchor="start" >0%</text><text x="265" y="245" class="sans" font-size="13" fill="#939BB4" text-anchor="start" >unhandled hardware freezes</text><text x="490" y="222" class="serif" font-size="30" fill="#E6E9F0" text-anchor="start" >2× Watchdog</text><text x="490" y="245" class="sans" font-size="13" fill="#939BB4" text-anchor="start" >hardware failsafe timers</text>
