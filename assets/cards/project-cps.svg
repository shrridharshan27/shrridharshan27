<rect x="183.265" y="264" width="124" height="24" rx="12" fill="#12182A" stroke="#2B3963"/><text x="194.265" y="280" class="mono" font-size="10.5" fill="#C5CAD8" text-anchor="start" >Microcontrollers</text>
